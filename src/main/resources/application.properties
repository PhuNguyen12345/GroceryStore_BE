spring.application.name=localpos
spring.datasource.url=jdbc:mysql://localhost:3306/grocery_store_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1231

# C?u hình Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# B?t Flyway
spring.flyway.enabled=true
# N?u mu?n Flyway t? t?o b?ng history l?n ??u
spring.flyway.baseline-on-migrate=true

# Log SQL cho d? debug (optional)
spring.jpa.show-sql=true


app.jwt.secret=key-gen-later
app.jwt.expiration-ms=86400000