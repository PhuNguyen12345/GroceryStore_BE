spring.application.name=localpos
spring.datasource.url=jdbc:mysql://localhost:3306/grocery_store_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=true

app.jwt.secret=key-gen-later

app.jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.file.upload-dir=uploads
app.file.public-url-prefix=/uploads

